name: Android Build & Test

on:
  push:
    branches: ["arena/**", "main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Run unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest --stacktrace

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle --no-daemon wrapper --gradle-version 8.10.2
      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sabztime-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  emulator-smoke:
    name: Emulator smoke test (instrumented)
    needs: apk
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm || echo "NO KVM on this runner"
      - name: Run instrumented smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            cd android
            gradle --no-daemon connectedDebugAndroidTest
