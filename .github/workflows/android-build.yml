name: Android Build & Test

on:
  push:
    branches: ["arena/**", "main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Run unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest --stacktrace

  apk:
    name: Build APK
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Generate Gradle wrapper (for reproducible builds)
        working-directory: android
        run: gradle --no-daemon wrapper --gradle-version 8.7
      - name: Build release APK + run tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleRelease
      - name: Commit wrapper and APK back to branch
        run: |
          set -e
          cd android
          git config user.name "sabztime-ci[bot]"
          git config user.email "sabztime-ci@users.noreply.github.com"
          git add -f gradle/wrapper gradlew gradlew.bat 2>/dev/null || true
          mkdir -p release
          APK=app/build/outputs/apk/release/app-release.apk
          if [ -f "$APK" ]; then
            cp "$APK" "release/sabztime-v1.0.0.apk"
            git add -f release/sabztime-v1.0.0.apk
            git commit -m "ci: build APK v1.0.0 ($(date -u +%Y%m%d%H%M))" || echo "nothing to commit"
            git push origin HEAD:"${GITHUB_REF_NAME}" || echo "push failed (branch protected?)"
          else
            echo "APK not found — build failed earlier"
            exit 1
          fi

  emulator-smoke:
    name: Emulator smoke test (instrumented)
    needs: apk
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Enable KVM (if the runner supports it)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm || echo "NO KVM on this runner"
      - name: Run instrumented smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            cd android
            gradle --no-daemon connectedDebugAndroidTest
