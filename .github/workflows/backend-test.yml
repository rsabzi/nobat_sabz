name: Backend API tests (PHP + MySQL)

on:
  push:
    branches: ["arena/**", "main"]
    paths:
      - "project/webapp/*.php"
      - "project/config.example.php"
      - "project/tests/**"
      - ".github/workflows/backend-test.yml"
  workflow_dispatch:

jobs:
  php-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sabztest
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_mysql, mbstring, ctype
      - name: Build test config
        run: |
          cat > project/config.php <<'EOF'
          <?php
          date_default_timezone_set('Asia/Tehran');
          define('BOT_TOKEN', 'TEST_TOKEN_NOT_A_REAL_TOKEN');
          define('BOT_USERNAME', 'sabztime_bot');
          define('BOT_API_URL', 'https://api.telegram.org/bot'.BOT_TOKEN.'/');
          define('BASE_URL', 'http://127.0.0.1:8090');
          define('WEBAPP_URL', BASE_URL . '/webapp/index.html?v=1.0');
          define('WEBAPP_URL_EDIT', BASE_URL . '/webapp/edit.html?v=1.0');
          define('WEBAPP_URL_SCHEDULE', BASE_URL . '/webapp/schedule.html?v=1.0');
          define('WEBAPP_URL_SERVICES', BASE_URL . '/webapp/services.html?v=1.0');
          define('WEBHOOK_URL', BASE_URL . '/bot/webhook.php');
          define('DB_HOST', '127.0.0.1');
          define('DB_NAME', 'sabztest');
          define('DB_USER', 'root');
          define('DB_PASS', 'root');
          define('DB_CHARSET', 'utf8mb4');
          define('DEV_MODE', true);
          define('REQUIRED_CHANNEL_ID', 0);
          define('REQUIRED_CHANNEL_USERNAME', 'sabztimebot');
          define('ADMIN_USERNAME', 'admin');
          define('ADMIN_PASSWORD', 'admin');
          define('INTERNAL_API_SECRET', 'test-internal-secret');
          $pdo = null;
          try {
              $pdo = new PDO('mysql:host=127.0.0.1;dbname=sabztest;charset=utf8mb4', 'root', 'root', [
                  PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
                  PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,
              ]);
          } catch (Exception $e) {
              throw new Exception('DB connect failed: ' . $e->getMessage());
          }
          ?>
          EOF
      - name: PHP syntax check
        run: |
          for f in project/webapp/*.php; do
            php -l "$f"
          done
      - name: Create tables
        run: mysql --force -h 127.0.0.1 -uroot -proot sabztest < project/create_tables.sql
      - name: Initialize database
        run: php project/database_init.php > /tmp/dbinit.log 2>&1 || (tail -40 /tmp/dbinit.log | sed 's/^/::error::/'; exit 1)
      - name: Start PHP server
        run: |
          cd project && nohup php -S 127.0.0.1:8090 > /tmp/phpserver.log 2>&1 &
          disown || true
          sleep 3
          curl -sS -o /dev/null -w '%{http_code}\n' "http://127.0.0.1:8090/webapp/search_api.php?action=search"
      - name: Run API smoke tests
        run: bash project/tests/api_smoke.sh
      - name: Guard regression tests (HTTP)
        run: bash project/tests/api_guard_http_test.sh
      - name: Debug on smoke failure
        if: failure()
        run: |
          tail -120 /tmp/phpserver.log | sed 's/^/::error::php: /' || true
          SEARCH=$(curl -s -i "http://127.0.0.1:8090/webapp/search_api.php?action=search&query=%D8%A2%D8%B1%D8%A7%DB%8C%D8%B4%DA%AF%D8%A7%D9%87") || true
          echo "$SEARCH" | head -40 | sed 's/^/::error::search: /'
          BID=$(mysql -N -h 127.0.0.1 -uroot -proot sabztest -e "SELECT id FROM businesses WHERE name='آرایشگاه تست' LIMIT 1" 2>/dev/null) || true
          echo "::error::bid=$BID"
          mysql -h 127.0.0.1 -uroot -proot sabztest -e "SELECT id,name,free_reservation_tokens,subscription_plan_id,is_active FROM businesses WHERE id=$BID" 2>&1 | sed 's/^/::error::biz: /' || true
